<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <!-- Add your stylesheets here -->
    <style>
        body {
            margin: 0;


        }


        .header {
            background-image: url(IMAGES/mainmenucat.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;

            padding-top: 100px;

            text-align: center;
            background-color: aquamarine;
            position: fixed;

            width: 100%;
            height: 100vh;
            display: block
        }

        .welcome {
            margin: 0 auto;
            padding: 10px;
            width: 50%;
            font-size: 1.5rem;
            pointer-events: none;
        }

        .startButton {
            font-size: 3vw;
            border-radius: 20px;
            margin: 30px auto;
            padding: 10px;
            pointer-events: auto;

        }




        .content {
            display: none;
            opacity: 0;
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: aquamarine;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;

        }



        .canvas {

            position: relative;
            max-height: 100vh;
            max-width: 100vw;
            display: flex;



        }


        #background {

            position: relative;


            width: auto;
            max-width: 100%;
            object-fit: contain;
        }

        #bed,
        #window,
        #easel,
        #rug,
        #frames,
        #light,
        #food,
        #drawer,
        #fishbowl,
        #glow {

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;



        }

        #vanillacat {
            position: absolute;
            cursor: pointer;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            top: 80%;
            left: 15%;
            max-width: 40%;
            max-height: 100%;
            pointer-events: none;

        }




        #catstare,
        #fish,
        #flower,
        #sun {
            display: none;
            position: absolute;
            cursor: pointer;
            pointer-events: auto;
            max-width: 100%;
            max-height: 100%;
            margin: auto;
            inset: 0;




        }

        #glow {
            opacity: 0;

        }

        .openLight {
            display: none;
            opacity: 0;
            border-radius: 25px;
            z-index: 10;
            position: absolute;
            cursor: pointer;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            top: 20%;
            left: 56%;
            padding-bottom: 5vw;
            font-size: 2vw;

        }

        .fishButton {
            opacity: 0;
            display: none;
            border-radius: 25px;
            z-index: 10;
            position: absolute;
            cursor: pointer;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            top: 32%;
            left: 45%;
            padding-bottom: 5vw;
            padding-left: 4vw;
            font-size: 2vw;
        }

        .meowButton {
            display: none;
            opacity: 0;
            border-radius: 25px;

            z-index: 10;
            position: absolute;
            cursor: pointer;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            top: 80%;
            left: 15%;
            padding-bottom: 20vw;
            padding-left: 10vw;
            font-size: 2vw;
        }


        .outdoorsButton {
            opacity: 0;
            display: none;
            border-radius: 25px;
            z-index: 10;
            position: absolute;
            cursor: pointer;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            top: 32%;
            left: 22%;


            font-size: 2vw;
        }



        .backButton {
            border-radius: 25px;
            font-size: 3vw;
            z-index: 10;
            position: absolute;
            transform: translate(-50%, -50%);
            top: 10%;
            left: 10%;
            cursor: pointer;
            pointer-events: auto;


        }

        .dialouge {
            display: none;
            position: absolute;
            transform: translate(-50%, -50%);
            top: 70%;
            left: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            z-index: 20;
            padding: 20px;
            border-radius: 10px;
            font-size: 2.5rem;



        }

        footer {
            position: absolute;
        }

        @media (max-width: 680px) {

            #fish,
            #catstare,
            #flower {
                width: 100vw;
                height: 100vh;
                object-fit: contain;
            }

            .dialouge {

                font-size: 1rem;
            }


        }
    </style>

</head>

<body>

    <div class="header">
        <div class="welcome">A Day In The Life Of A Cat</div>

        <button class="startButton">Start</button>
    </div>
    <audio id="lightclick">
        <source src="SOUND/light.mp3" type="audio/mpeg">
    </audio>

    <audio id="catclick">
        <source src="SOUND/meow.mp3" type="audio/mpeg">
    </audio>

    <audio id="fishbowlclick">
        <source src="SOUND/glass.mp3" type="audio/mpeg">
    </audio>

    <audio id="fishclick">
        <source src="SOUND/fish.mp3" type="audio/mpeg">
    </audio>

    <p>Relaxing Music For Cats</p>
    <audio controls id="backgroundMusic" autoplay muted loop>
        <source src="SOUND/background.mp3" type="audio/mpeg">
    </audio>

    <div class="content">
        <div class="canvas">
            <img id=background src="IMAGES/background.png">
            <img id="frames" src="IMAGES/frames.png">
            <img id="bed" src="IMAGES/bed.png">
            <img id="light" src="IMAGES/light.png">
            <img id="window" src="IMAGES/window.png">
            <img id="easel" src="IMAGES/easel.png">
            <button class="openLight">OpenLight</button>
            <button class="meowButton">Hello!!</button>
            <button class="fishButton">fish</button>
            <button class="outdoorsButton">Outside</button>

            <img id="rug" src="IMAGES/rug.png">
            <img id="food" src="IMAGES/food.png">
            <img id="drawer" src="IMAGES/drawer.png">
            <img id="fishbowl" src="IMAGES/fish.png">
            <img id="glow" src="IMAGES/glow.png">
            <img id="vanillacat" src="IMAGES/vanillacat.png">



            <button class="backButton">Back</button>
        </div>
        <div class="scene">
            <div class="dialouge">Hello!</div>
            <img id="fish" src="IMAGES/fish (2).jpg">
            <img id="catstare" src="IMAGES/catstare.jpeg">
            <img id="flower" src="IMAGES/flower.png">
        </div>



    </div>

    <div class="footer">

    </div>

    <!-- Add your script files -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {


            const header = document.querySelector('.header');
            const startButton = document.querySelector('.startButton');
            const welcome = document.querySelector('.welcome');
            const content = document.querySelector('.content');
            const backButton = document.querySelector('.backButton');
            const canvas = document.querySelector('.canvas');
            const disapear = document.querySelector('.disapear');

            const openLight = document.querySelector('.openLight')
            const glow = document.getElementById('glow')
            const lightclick = document.getElementById('lightclick')


            const meowButton = document.querySelector('.meowButton')
            const catclick = document.getElementById('catclick')
            const vanillacat = document.getElementById('vanillacat')

            const fishButton = document.querySelector('.fishButton')
            const fishbowlclick = document.getElementById('fishbowlclick')
            const fishclick = document.getElementById('fishclick')
            const fishbowl = document.getElementById('fishbowl')
            const fish = document.getElementById('fish')
            const catstare = document.getElementById('catstare')



            const outdoorsButton = document.querySelector('.outdoorsButton')
            const flower = document.getElementById('flower')
            const sun = document.getElementById('sun')
            let isFlowerScene = false;



            const dialouge = document.querySelector('.dialouge');



            // startButton.addEventListener('mouseover', function () {
            gsap.to(welcome, {
                scale: 2,
                duration: 1,
                ease: "power1.out",
            });
            startButton.addEventListener('click', function () {
                const timeline = gsap.timeline({ defaults: { duration: 1 } })
                timeline
                    .to(header, { opacity: 0, display: 'none' }, "<")
                    .to(content, { opacity: 1, duration: 1, display: 'flex', }, "<")
                    .to(openLight, { opacity: 0, duration: 1, display: 'flex', }, "<")
                    .to(fishButton, { opacity: 0, duration: 1, display: 'flex', }, "<")
                    .to(meowButton, { opacity: 0, duration: 1, display: 'flex', }, "<")

            })
            backButton.addEventListener('click', function () {
                const timeline = gsap.timeline({ defaults: { duration: 2 } });
                timeline
                    .fromTo(header,
                        { opacity: 0, display: 'block' },
                        { opacity: 1, display: 'block', ease: "power1.out" }
                    )
                    .fromTo(welcome,
                        { scale: 1 },
                        { scale: 2, ease: "power1.out" },
                        "<")
                    .fromTo(startButton,
                        { opacity: 0 },
                        { opacity: 1 },
                        "<")

                    .to(content, { opacity: 0, display: 'none' }, "<");


            });

            backButton.addEventListener('mouseover', function () {

                dialouge.style.display = "flex";
                dialouge.innerText = "Don't leave me! I want to play with you!"
            });

            backButton.addEventListener('mouseout', function () {
                dialouge.style.display = "none";
            });

            openLight.addEventListener('click', function () {
                lightclick.play()

                const timeline = gsap.timeline({ defaults: { duration: 1 } });
                timeline

                    .fromTo(glow,
                        { opacity: 1, display: 'block' },
                        { opacity: 0, display: 'block', ease: "power1.out" }
                    )




            });

            openLight.addEventListener('mouseover', function () {

                dialouge.style.display = "flex";
                dialouge.innerText = "I want to make YOUR purr-sonality shine!"
            })

            openLight.addEventListener('mouseout', function () {
                dialouge.style.display = "none";

            });




            meowButton.addEventListener('mouseover', function () {
                catclick.play()
                const timeline = gsap.timeline({ defaults: { duration: 0.1 } });
                timeline

                    .fromTo(vanillacat,
                        { opacity: 1, scale: 1 },
                        { opacity: 1, scale: 1.5, ease: "power1.out" }
                    );
                dialouge.style.display = "flex";
                dialouge.innerText = "Meow! How are you? I'm feline good!"
            });

            meowButton.addEventListener('mouseout', function () {

                const timeline = gsap.timeline({ defaults: { duration: 0.1 } });
                timeline

                    .fromTo(vanillacat,
                        { opacity: 1 },
                        { opacity: 1, scale: 1, ease: "power1.out" }
                    );
                dialouge.style.display = "none";
            });





            fishButton.addEventListener('mouseover', function () {
                fishbowlclick.play()
                dialouge.style.display = "flex";
                dialouge.innerText = "Let's chat with my fishy friend!"
                const timeline = gsap.timeline({ defaults: { duration: 0.1 } });
                timeline

                    .fromTo(fishbowl,
                        { opacity: 1, scale: 1 },
                        { opacity: 1, scale: 1.1, y: -10, ease: "power1.out" }
                    );
            });

            fishButton.addEventListener('mouseout', function () {


                const timeline = gsap.timeline({ defaults: { duration: 0.1 } });
                timeline
                

                    .fromTo(fishbowl,
                        { opacity: 1, scale: 1.1},
                        { opacity: 1, scale: 1, y: 0, ease: "power1.out" }
                    );

            });

            fishButton.addEventListener('click', function () {

                fishclick.play()
                const timeline = gsap.timeline({ defaults: { duration: 1 } });
                timeline
                    .fromTo(fish,
                        { opacity: 0, scale: 1 },
                        { opacity: 1, display: 'flex', scale: 1, y: -100, ease: "power1.out" }, "<")
                    .fromTo(canvas,
                        { opacity: 1 },
                        { opacity: 0, display: 'none', ease: "power1.out" }, "<");
                dialouge.style.display = "flex";
                dialouge.innerText = "blub... can you help me find something? blub.. blub.."
                return;

            });

            fish.addEventListener('click', function () {
                catclick.play()
                const timeline = gsap.timeline({ defaults: { duration: 1 } });
                timeline
                    .fromTo(catstare,
                        { opacity: 0, scale: 1 },
                        { opacity: 1, display: 'flex', y: -200, ease: "power1.out" }, "<")
                    .fromTo(fish,
                        { opacity: 1 },
                        { opacity: 0, display: 'none', ease: "power1.out" }, "<")
                dialouge.style.display = "flex";
                dialouge.innerText = "Meow! You look tasty! Meow I want to eat you! Meow!"
            });

            catstare.addEventListener('click', function () {
                fishclick.play()
                const timeline = gsap.timeline({ defaults: { duration: 0.1 } });
                timeline
                    .fromTo(catstare,
                        { opacity: 1 },
                        { opacity: 0, display: 'none', ease: "power1.out" }, "<")
                    .fromTo(fish,
                        { opacity: 0 },
                        { opacity: 1, display: 'flex', ease: "power1.out" }, "<")

                dialouge.style.display = "flex";
                dialouge.innerText = "blub... stop joking around with me! blub.. blub.."

                fish.addEventListener('click', function () {
                    catclick.play()
                    const timeline = gsap.timeline({ defaults: { duration: 1 } });
                    timeline
                        .fromTo(catstare,
                            { opacity: 0 },
                            { opacity: 1, display: 'flex', ease: "power1.in" }, "<")
                        .fromTo(fish,
                            { opacity: 1 },
                            { opacity: 0, display: 'none', ease: "power1.out" }, "<")

                    dialouge.style.display = "flex";
                    dialouge.innerText = "Mweowhahaah >:D! I will eat you now! Meow!"

                    catstare.addEventListener('click', function () {
                        fishclick.play()
                        const timeline = gsap.timeline({ defaults: { duration: 0.1 } });
                        timeline
                            .fromTo(catstare,
                                { opacity: 1 },
                                { opacity: 0, display: 'none', ease: "power1.out" }, "<")
                            .fromTo(fish,
                                { opacity: 0 },
                                { opacity: 1, display: 'flex', ease: "power1.out" }, "<")

                        dialouge.style.display = "flex";
                        dialouge.innerText = "Ahhhhh!!! *hides*"

                        fish.addEventListener('click', function () {
                            catclick.play()
                            const timeline = gsap.timeline({ defaults: { duration: 1 } });
                            timeline
                                .fromTo(outdoorsButton,
                                    { opacity: 0 },
                                    { opacity: 1, display: 'flex', ease: "power1.out" }, "<")
                                .fromTo(catstare,
                                    { opacity: 0 },
                                    { opacity: 1, display: 'flex', ease: "power1.out" }, "<")
                                .fromTo(fish,
                                    { opacity: 1 },
                                    { opacity: 0, display: 'none', ease: "power1.out" }, "<")
                                .fromTo(catstare,
                                    { opacity: 1 },
                                    { opacity: 0, display: 'none', ease: "power1.out" }, "<")
                                .fromTo(canvas,
                                    { opacity: 0 },
                                    { opacity: 1, display: 'flex', ease: "power1.out" }, "<")



                            dialouge.style.display = "flex";
                            dialouge.innerText = "oh my meow! My fishy friend ran away"
                            outdoorsButton.addEventListener('mouseover', function () {
                               
                                dialouge.style.display = "flex";
                                dialouge.innerText = "Maybe there's something outside!"
                            })

                            outdoorsButton.addEventListener('mouseout', function () {
                                if (!isFlowerScene) {
                                    dialouge.style.display = "none";
                                }

                            })


                            outdoorsButton.addEventListener('click', function () {
                                isFlowerScene = true;
                                const timeline = gsap.timeline({ defaults: { duration: 1 } });
                                timeline
                                    .fromTo(flower,
                                        { opacity: 0, scale: 1 },
                                        { opacity: 1, display: 'flex', scale: 1, y: -100, ease: "power1.out" }, "<")

                                    .fromTo(canvas,
                                        { opacity: 1 },
                                        { opacity: 0, display: 'none', ease: "power1.out" }, "<");

                                        
                                dialouge.style.display = "flex";
                                dialouge.innerText = " Flowers! Let's smell them together!"
                                catclick.play()
                                

                            })






                            fishButton.addEventListener('mouseover', function () {


                                const timeline = gsap.timeline({ defaults: { duration: 0.1 } });
                                timeline

                                    .fromTo(fishbowl,
                                        { opacity: 1, },
                                        { opacity: 1, ease: "power1.out" }, "<")
                                    .fromTo(fishButton,
                                        { opacity: 0 },
                                        { opacity: 0, display: 'flex', ease: "power1.out" })
                                        
                                dialouge.style.display = "flex";
                                dialouge.innerText = " My fishy friend wants something! I need to find it right meow to apologize!"
                            

                            fishButton.addEventListener('mouseout', function () 
                        { 
                              const timeline = gsap.timeline({ defaults: { duration: 0.1 } });
                                timeline
                                .fromTo(fishbowl,
                                        { opacity: 1, },
                                        { opacity: 1, y: 0, ease: "power1.out" }, "<")
                                    .fromTo(fishButton,
                                        { opacity: 0 },
                                        { opacity: 0, display: 'flex', ease: "power1.out" })
                
                             })

                              fishButton.addEventListener('click', function () 
                        { 
                              const timeline = gsap.timeline({ defaults: { duration: 0.1 } });
                                timeline
                                .fromTo(fishbowl,
                                        { opacity: 1, },
                                        { opacity: 1, y: 0, ease: "power1.out" }, "<")
                                    .fromTo(fishButton,
                                        { opacity: 0 },
                                        { opacity: 0, display: 'flex', ease: "power1.out" })
                                    dialouge.style.display = "flex";
                                dialouge.innerText = " Go away!"
                                        
                              
                             })

                                
                                        
                              
})




                            flower.addEventListener('click', function () {
                                fishclick.play()
                                dialouge.style.display = "none";
                                const timeline = gsap.timeline({ defaults: { duration: 1 } });
                                timeline
                                    .fromTo(flower,
                                        { opacity: 0 },
                                        { opacity: 0, display: 'none', ease: "power1.out" }, "<")
                                    .fromTo(fish,
                                        { opacity: 0 },
                                        { opacity: 1, display: 'flex', ease: "power1.out" }, "<")
                                dialouge.style.display = "flex";
                                dialouge.innerText = "Thank you for helping me find my flowers! I love them! Blub!"
                                fish.addEventListener('click', function () {
                                    catclick.play()
                                    const timeline = gsap.timeline({ defaults: { duration: 1 } });
                                    timeline
                                        .fromTo(catstare,
                                            { opacity: 0 },
                                            { opacity: 0, display: 'none', y: -200, ease: "power1.out" })
                                        .fromTo(fish,
                                            { opacity: 1 },
                                            { opacity: 0, display: 'none', ease: "power1.out" }, "<")
                                           
                                    dialouge.style.display = "flex";
                                    dialouge.innerText = "Omg my fishy friend loves flowers! Thank you for helping me find them! Meow!"
                                      fishButton.addEventListener('mouseover', function () {


                                const timeline = gsap.timeline({ defaults: { duration: 0.1 } });
                                timeline

                                    .fromTo(fishbowl,
                                        { opacity: 1, scale: 1},
                                        { opacity: 1, display: 'flex',scale: 1}, "<")
                                    .fromTo(fishButton,
                                        { opacity: 0, display: 'flex'},
                                        { opacity: 0, display: 'flex', ease: "power1.out" })
                                        
                                dialouge.style.display = "flex";
                                dialouge.innerText = " Say hi to fishy friend again!"

                                 

                                fishButton.addEventListener('click', function () {


                                const timeline = gsap.timeline({ defaults: { duration: 0.1 } });
                                timeline

                                    .fromTo(fishbowl,
                                        { opacity: 1, scale: 1},
                                        { opacity: 1, display: 'flex',scale: 1}, "<")
                                    .fromTo(fishButton,
                                        { opacity: 0 },
                                        { opacity: 0, display: 'none', ease: "power1.out" })
                                        
                                        
                                dialouge.style.display = "flex";
                                dialouge.innerText = " *bubbles in happiness*"

                                    

                                   
});});


                                   


                                    catstare.addEventListener('click', function () {
                                        fishclick.play()
                                        const timeline = gsap.timeline({ defaults: { duration: 0.1 } });
                                        timeline
                                            .fromTo(catstare,
                                                { opacity: 1 },
                                                { opacity: 0, display: 'none', ease: "power1.out" }, "<")
                                            .fromTo(fish,
                                                { opacity: 0 },
                                                { opacity: 0, display: 'none', ease: "power1.out" }, "<")

                                        dialouge.style.display = "flex";
                                        dialouge.innerText = "Let's go back inside and explore!"

                                    });
                                    outdoorsButton.addEventListener('click', function () {

                                        const timeline = gsap.timeline({ defaults: { duration: 1 } });
                                        timeline
                                            .fromTo(flower,
                                                { opacity: 1 },
                                                { opacity: 0, display: 'none', ease: "power1.out" }, "<")
                                            .fromTo(canvas,
                                                { opacity: 0 },
                                                { opacity: 1, display: 'flex', ease: "power1.out" }, "<");
                                        dialouge.style.display = "flex";
                                        dialouge.innerText = "Let's go back inside and explore"

                                        fishbowl.addEventListener('click', function () {
                                            fishbowlclick.play()
                                            const timeline = gsap.timeline({ defaults: { duration: .1 } });
                                            timeline
                                                .fromTo(fish,
                                                    { opacity: 0 },
                                                    { opacity: 1, display: 'flex', ease: "power1.out" }, "<")

                                            dialouge.style.display = "flex";
                                            dialouge.innerText = "Thank you for helping me find my flowers! I love them! Blub!"

                                        });

                                        






                                    });
                                });
                            });
                        });
                    });
                });
            });
        });














    </script>
</body>

</html>
