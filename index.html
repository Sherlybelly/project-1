<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <!-- Add your stylesheets here -->
    <style>
        body {
            margin: 0;

        }

        .header {

            padding-top: 100px;
            padding-bottom: 30px;
            background-color: aquamarine;
            display: flex;
            justify-content: center;

        }


        .content {
            background-color: aquamarine;
            display: flex;
            justify-content: center;
        }

        .backButton {
            display: none;
        }
    </style>

</head>

<body>
    <div class="header">
        <div class="links">Welcome to Art of Artists</div>

    </div>

    <div class="content">
        <button class="startButton">Start</button>
    </div>

    <div class="footer">
        <button class="backButton">Back</button>
    </div>

    <!-- Add your script files -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const startButton = document.querySelector('.startButton');
            const links = document.querySelector('.links');

            const header = document.querySelector('.header');
            const content = document.querySelector('.content');

            const backButton = document.querySelector('.backButton');

            // startButton.addEventListener('mouseover', function () {
            gsap.to(links, {
                scale: 2,
                duration: 3,
                ease: "power1.out",
            });
            startButton.addEventListener('click', function () {
                const timeline = gsap.timeline({ defaults: 1 })
                timeline
                    .to(links, { opacity: 0, display: 'none' })
                    .to(header, { opacity: 0, display: 'none' }, "<")
                    .to(startButton, { opacity: 0, display: 'none' }, "<")
                    .to(content, { opacity: 0, display: 'none' }, "<")
                    .to(backButton, { opacity: 1, ease: "power1.out", duration: 5, display: 'inline' })
                //  {
                //     gsap.to(links, {
                //         opacity: 0,
                //         duration: 2,
                //         display: 'none'
                //     })
                //     gsap.to(header, {
                //         opacity: 0,
                //         duration: 2,
                //         display: 'none'
                //     })
                //     gsap.to(startButton, {
                //         opacity: 0,
                //         duration: 2,
                //         display: 'none'

                //     })
                //     gsap.to(content, {
                //         opacity: 0,
                //         duration: 2,
                //         display: 'none'

                //     })
            })
            backButton.addEventListener('click', function () {
                    gsap.to(links, {
                        opacity: 1,
                        duration: 2,
                        display: 'flex'
                    })
                    gsap.to(header, {
                        opacity: 1,
                        duration: 2,
                        display: 'flex'
                    })
                    gsap.to(startButton, {
                        opacity: 1,
                        duration: 2,
                        display: 'flex'

                    })
                    gsap.to(content, {
                        opacity: 1,
                        duration: 2,
                        display: 'flex'

                })
            })


        });


    </script>
</body>

</html>
