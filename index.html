<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <!-- Add your stylesheets here -->
    <style>
        body {
            margin: 0;
overflow: hidden;

        }

        .header {
            background-image: url(IMAGES/mainmenucat.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            
            padding-top: 100px;
            padding-bottom: 100%;
            text-align: center;
            background-color: aquamarine;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
        }

        .welcome {

flex-wrap: wrap;
            padding-bottom: 20px;
            pointer-events: none;
            position: relative;
        }

        .content {
            background-image: url(IMAGES/background.png);
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            text-align: center;
            width: 100%;
            height: 100vh;
     
           


        }


        .backButton {
            position: relative;
        }

        footer {
            position: absolute;
        }

        @media screen and (max-width: 640px) {
            .header, .content {
background-size: cover;
             width: 100%;
                height: 100vh;
            }
            

        
        }
    </style>

</head>

<body>
    <div class="header">
        <div class="welcome">A Day In The Life Of A Cat</div>

        <button class="startButton">Start</button>
    </div>

    <div class="content">
        <!-- <img id=background src="IMAGES/background.png"> -->
        <!-- <img src="IMAGES/bed.png"> -->
        <button class="backButton">Back</button>
    </div>

    <div class="footer">

    </div>

    <!-- Add your script files -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const startButton = document.querySelector('.startButton');
            const welcome = document.querySelector('.welcome');

            const header = document.querySelector('.header');
            const content = document.querySelector('.content');

            const backButton = document.querySelector('.backButton');

            // startButton.addEventListener('mouseover', function () {
            gsap.to(welcome, {
                scale: 2,
                duration: 1,
                ease: "power1.out",
            });
            startButton.addEventListener('click', function () {
                const timeline = gsap.timeline({ defaults: { duration: 1 } })
                timeline
                    .to(header, { opacity: 0, display: 'none' }, "<")
                    .to(content, { opacity: 1, duration: 1, display: 'block' })

            })
            backButton.addEventListener('click', function () {
                const timeline = gsap.timeline({ defaults: { duration: 2 } });
                timeline
                    .fromTo(header,
                        { opacity: 0, display: 'block' },
                        { opacity: 1, display: 'block', ease: "power1.out" }
                    )
                    .fromTo(welcome,
                        { scale: 1 },
                        { scale: 2, ease: "power1.out" },
                        "<")
                    .fromTo(startButton,
                        { opacity: 0 },
                        { opacity: 1 },
                        "<")

                    .to(content, { opacity: 0, display: 'none' }, "<");
            });


        });





    </script>
</body>

</html>
